<style>
:root{--bw:1.5px;--onacc:#fff;--onyn:#fff}
/* ---------- Christmas palette (LOCKED). Nobody can switch color themes. ---------- */
:root{--bg:#0e2a1c;--fg:#fdf6e8;--card:#133a28;--mut:#bfd9c6;--line:#1f5238;--bd:#3d7a58;--yes:#5fe39a;--no:#ff7b7b;--acc:#f5c542;--side:#0b2418;--hov:#1c4d35;--onacc:#2b1b00;--onyn:#06210f;--stk:drop-shadow(1.5px 0 0 #fffaf0) drop-shadow(-1.5px 0 0 #fffaf0) drop-shadow(0 1.5px 0 #fffaf0) drop-shadow(0 -1.5px 0 #fffaf0) drop-shadow(0 3px 4px #0a2a1a88)}
:root{--grad:linear-gradient(120deg,color-mix(in srgb,var(--acc) 22%,var(--card)),color-mix(in srgb,var(--acc) 5%,var(--card)))}
/* Background pattern lives on a fixed layer, so it stays put while the page scrolls */

[data-pat=dots] body::before{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}

[data-pat=lines] body::before{background-image:repeating-linear-gradient(45deg,var(--line) 0 1px,transparent 1px 14px)}
[data-pat=leaves] body::before{background:none}
#leafbg{display:none;position:fixed;left:0;top:0;z-index:-1;pointer-events:none}
[data-pat=leaves] #leafbg{display:block}
[data-pat=plaid] body::before{background-image:repeating-linear-gradient(0deg,color-mix(in srgb,var(--acc) 14%,transparent) 0 14px,transparent 14px 40px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--acc) 14%,transparent) 0 14px,transparent 14px 40px),repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 10px)}
/* Wrapping paper: the default background. Red paper, candy stripes, snowflake dots and a gold ribbon. */
[data-pat=wrapping] body::before{background-color:#8f1620;background-image:linear-gradient(90deg,transparent calc(78% - 27px),#0000003d calc(78% - 27px),#0000003d calc(78% - 24px),#f5c542 calc(78% - 24px),#f5c542 calc(78% + 24px),#0000003d calc(78% + 24px),#0000003d calc(78% + 27px),transparent calc(78% + 27px)),linear-gradient(0deg,transparent calc(22% - 27px),#0000003d calc(22% - 27px),#0000003d calc(22% - 24px),#f5c542 calc(22% - 24px),#f5c542 calc(22% + 24px),#0000003d calc(22% + 24px),#0000003d calc(22% + 27px),transparent calc(22% + 27px)),repeating-linear-gradient(135deg,#ffffff17 0 12px,transparent 12px 44px),radial-gradient(circle at 22px 22px,#ffffffdd 2.4px,transparent 3.2px),radial-gradient(circle at 66px 66px,#f5c542 2.2px,transparent 3px);background-size:100% 100%,100% 100%,auto,88px 88px,88px 88px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Fraunces,Georgia,serif;-webkit-font-smoothing:antialiased}

#shell{display:flex;min-height:100vh;position:relative;z-index:1}
nav{width:204px;flex-shrink:0;background:var(--side);border-right:var(--bw) solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1px;font-size:14px;overflow-y:auto}

.qt button.n,#qbok.n{background:color-mix(in srgb,var(--no) 14%,transparent);border:2px solid var(--no);color:var(--no)}

.narrow{max-width:540px}
.big{font-size:23px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--no);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--yes)}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mut{color:var(--mut);font-size:13.5px}
a{color:var(--acc)}
.chip{background:var(--hov);color:var(--acc);border:var(--bw) solid var(--bd);border-radius:6px;padding:0 7px;font-size:11px;font-weight:600}
.tags{margin:0 0 10px}
.tag{display:inline-block;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#dc2626,#15803d);border-radius:4px}
input,button,select,textarea{font:inherit;padding:9px 12px;border-radius:6px;border:var(--bw) solid var(--bd);background:var(--bg);color:var(--fg)}
input,textarea{width:100%;margin-top:8px}
textarea{resize:vertical}
input[type=range]{padding:0;accent-color:var(--acc);border:0;background:none}

label{display:block;flex:1;min-width:140px}

button.g:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
/* the red Christmas call-to-action button */
button.tk,.btn.tk{background:linear-gradient(135deg,#ef4444,#b91c1c);border-color:#fca5a5;color:#fff;text-shadow:0 1px 2px #3b0a0a88;box-shadow:0 3px 0 #7f1d1d}

.btn{display:inline-block;padding:9px 14px;border-radius:6px;background:var(--acc);color:var(--onacc);cursor:pointer;font-weight:600}

.sel{outline:var(--bw) solid var(--acc);outline-offset:1px}

.search{max-width:420px;margin:6px 0 4px}

.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--hov);border:var(--bw) solid var(--bd);font-size:12px;font-weight:600;flex-shrink:0;margin-right:6px;vertical-align:middle;color:var(--fg);overflow:hidden}

.rc{display:inline-block;background:var(--card);border:var(--bw) solid var(--bd);border-radius:6px;padding:3px 10px;white-space:nowrap}
.ev-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;margin:0 0 16px;border-radius:18px;border:var(--bw) solid #f5c542;background:linear-gradient(110deg,#7f1d1d,#b91c1c 55%,#166534);color:#fff}
.ev-bar a{color:#fff;font-weight:600}

.lb{display:flex;flex-direction:column;gap:6px}

.sm .lbh,.sm .lbr{grid-template-columns:34px 1fr auto;padding:5px 10px}

.stk-btn:not(.off){animation:stkpulse 2.6s ease-in-out infinite}
.stk-panel{background:var(--card);border:var(--bw) solid var(--acc);border-radius:8px;padding:14px 16px;width:280px}

/* rounder corners */

/* =============== CHRISTMAS EXTRAS =============== */
/* falling snow (decoration only) */
#leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}

// ---------- Pricing: money-share market ----------
const py = m => +m.money_yes / (+m.money_yes + +m.money_no);
const sidePrice = (m, side) => side === 'yes' ? py(m) : 1 - py(m);
const boughtAtPrice = (m, p) => +p.shares > 0 ? +p.invested / +p.shares : sidePrice(m, p.side);
const positionValue = (m, p) => +p.shares * sidePrice(m, p.side);
// what a cash-out actually pays: on the Market of the Week, profit is doubled (losses are not)
const cashValue = (m, p) => { const v = positionValue(m, p), inv = +p.invested; return m.is_motw && v > inv ? inv + 2 * (v - inv) : v; };
const mState = m => m.status !== 'open' ? (m.outcome === 'void' ? 'Cancelled' : 'Resolved: ' + m.outcome.toUpperCase()) : ((m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END ? 'Trading closed' : 'Open');

function info(m){
  const cd = CD.find(c => c.market_id === m.id);
  const until = cd ? cd.until : 0;
  return {y: py(m), open: m.status === 'open', closed: !!(m.closes_at && new Date(m.closes_at) <= Date.now()) || Date.now() >= SEASON_END, locked: until > Date.now(), until, own: m.creator === me.id, prop: m.proposer_id === me.id};
}

  if (pts.length < 2) return '<p class="mut">The price chart appears after the first trade.</p>';
  const W = 640, H = 270, L = 46, R = 12, TP = 10, B = 44, pw = W - L - R, ph = H - TP - B, n = pts.length;
  const X = i => L + i * pw / (n - 1), Y = p => TP + (1 - p) * ph;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p).toFixed(1)).join('');
  const grid = [0, .25, .5, .75, 1].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"${v === .5 ? ' stroke-dasharray="4"' : ''}/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v * 100)}%</text>`).join('');
  const xs = [...new Set([0, Math.round((n - 1) / 2), n - 1])].map(i => `<text x="${X(i)}" y="${H - 24}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--mut)">${i === 0 ? 'Open' : '#' + i}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/>${xs}<text x="${L + pw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--mut)">Trade number (Open = starting odds)</text><text transform="rotate(-90)" x="${-(TP + ph / 2)}" y="12" text-anchor="middle" font-size="11" fill="var(--mut)">YES probability (%)</text></svg>`;
}

  <p class="mut">🎄 Merry Christmas! Please sign up with your Head-Royce email</p>

async function auth(login){
  const email = $('#e').value.trim(), password = $('#p').value, username = $('#u').value.trim();
  if (!login) {
    if (ALLOWED_DOMAINS.length && !ALLOWED_DOMAINS.includes(email.split('@').pop().toLowerCase())) return toast('Please use your ' + ALLOWED_DOMAINS.join(' or ') + ' email.');
    if (!/^[A-Za-z0-9_.-]{3,20}$/.test(username)) return toast('Username: 3-20 letters, numbers, dot, dash or underscore.');
    if (password.length < 8) return toast('Use a password of at least 8 characters.');
  }
  const r = login ? await sb.auth.signInWithPassword({email, password}) : await sb.auth.signUp({email, password, options:{data:{username, referred_by:savedRef()}}});
  if (r.error) return toast(r.error.message);
  if (!r.data.session) return toast('Check your email to confirm, then log in.');
  load();
}

// ---------- data ----------
const AT = {}, LOADED = {};
const TTL = {ev:60e3, act:60e3, pts:60e3, lb:30e3, final:300e3, staff:60e3, inv:60e3, pr:60e3, streak:60e3, sboard:60e3, co:60e3, shop:60e3, special:60e3, te:30e3, stats:30e3, hist:30e3, ideas:30e3, xm:30e3};
const EXTRAS = {markets:['act'], market:['pts'], leaderboard:['lb','final','sboard'], admin:['staff','inv','final','special'], suggest:['pr'], review:['pr'], shop:['shop'], account:['stats','hist','shop'], inventory:['shop','special'], ideas:['ideas'], xmas:['xm'], advent:['xm'], santa:['xm']};
const BLOCKING = {leaderboard:1, admin:1, suggest:1, review:1, shop:1, account:1, inventory:1, ideas:1, xmas:1, advent:1, santa:1};

const FETCH = {
  ev: async () => { const r = await sb.rpc('referral_event_info'); REV = r.data || null; return r; },
  act: async () => { const r = await sb.rpc('market_activity'); ACT = {}; (r.data || []).forEach(x => { ACT[x.market_id] = x.recent; }); return r; },
  pts: async () => { const r = await sb.rpc('price_points'); T = r.data || []; return r; },
  lb: async () => {
    let r = await sb.rpc('leaderboard_plus');
    if (r.error) { r = await sb.rpc('leaderboard'); LBX = false; } else LBX = true;
    LB = r.data || []; return r;
  },
  final: async () => { const r = await sb.from('season_final').select('place,username,score').order('place'); FINAL = r.data || []; return r; },
  staff: async () => { const r = await sb.from('profiles').select('username,role').neq('role','user'); STAFF = r.data || []; return r; },
  inv: async () => { const r = await sb.from('invite_codes').select('code,used_by'); INV = r.data || []; return r; },
  pr: async () => { const r = await sb.from('proposals').select('id,question,closes_at,status,note,cooldown_seconds,profiles(username)').order('created_at', {ascending:false}).limit(100); PR = r.data || []; return r; },
  streak: async () => { const r = await sb.rpc('my_streak'); STK = (r.data && r.data[0]) || null; return r; },
  sboard: async () => { const r = await sb.rpc('streak_board'); SBD = r.data || []; return r; },
  co: async () => { const r = await sb.rpc('cosmetics'); CO = {}; (r.data || []).forEach(x => { CO[x.username] = x; }); return r; },
  shop: async () => {
    const [a, b] = await Promise.all([sb.from('shop_items').select().order('sort'), sb.from('user_items').select('item_id')]);
    SHOPERR = (a.error && a.error.message) || ''; SHOP = a.data || []; OWN = (b.data || []).map(x => x.item_id);
    return a.error ? a : b;
  },
  // earned banners/icons: first let the server hand them out, then load them, who holds them, and refresh names + my profile
  special: async () => {
    await sb.rpc('refresh_special_items');
    const [a, b, c, d, e] = await Promise.all([
      sb.from('special_items').select().order('id'),
      sb.from('special_awards').select('item_id'),
      sb.rpc('special_holders'),
      sb.rpc('cosmetics'),
      sb.from('profiles').select().eq('id', me.id).single()
    ]);
    SPECIAL = (a.data || []).map(r => ({id:'sp_' + r.id, rid:r.id, kind:r.kind, name:r.name, criteria:r.criteria, art:r.art, price:0, special:true}));
    SHELD = (b.data || []).map(r => 'sp_' + r.item_id);
    SHOLD = c.data || [];
    if (d.data) { CO = {}; d.data.forEach(x => { CO[x.username] = x; }); }
    if (e.data) me = e.data;
    return a.error ? a : b;
  },
  stats: async () => { const r = await sb.rpc('my_stats'); STAT = (r.data && r.data[0]) || null; return r; },
  hist: async () => { const r = await sb.rpc('my_trades'); HIST = r.data || []; return r; },
  ideas: async () => { const r = await sb.from('site_ideas').select('id,body,status,created_at,profiles(username)').order('created_at', {ascending:false}).limit(200); IDEAS = r.data || []; return r; },

  xm: async () => {
    const r = await sb.rpc('xmas_info');

};

// number of unread ideas (only the owner can see everyone's ideas)
const ideaNew = () => me && me.role === 'owner' ? IDEAS.filter(x => x.status === 'new').length : 0;

async function ensureExtras(){
  if (!me) return;
  const page = (location.hash.slice(2) || 'markets').split('/')[0];
  const keys = new Set(EXTRAS[page] || []);
  ['ev', 'streak', 'co', 'shop', 'special', 'xm'].forEach(k => keys.add(k));
  if (me.role !== 'user') keys.add('pr');
  if (me.role === 'owner') keys.add('ideas');
  const stale = [...keys].filter(k => !AT[k] || Date.now() - AT[k] > TTL[k]);
  if (!stale.length) return;
  const firstLoad = stale.filter(k => !LOADED[k]), prevPresent = XM ? XM.present_market_id : null;
  stale.forEach(k => { AT[k] = Date.now(); });
  await Promise.all(stale.map(async k => {
    const r = await FETCH[k]();
    if (r.error) AT[k] = 0;
    LOADED[k] = true;
  }));
  const cur = (location.hash.slice(2) || 'markets').split('/')[0];
  const quiet = ['ev', 'streak', 'xm'];
  const presentMoved = (XM ? XM.present_market_id : null) !== prevPresent;
  if (stale.every(k => quiet.includes(k)) && !firstLoad.includes('xm') && !presentMoved && cur === page && page !== 'xmas' && page !== 'advent' && page !== 'santa') {
    const rb = $('#rb'); if (rb) rb.innerHTML = giftBanner() + eventBanner() + xmasBanner();
    const sw = $('#stkw'); if (sw) sw.innerHTML = streakBadge();
    return;
  }
  render();
}

function resetCaches(){
  for (const k in AT) delete AT[k];
  for (const k in LOADED) delete LOADED[k];
  STK = null; SBD = []; STK_OPEN = false; UP = {}; UPtok = {}; CO = {}; SHOP = []; OWN = []; STAT = null; HIST = []; IDEAS = [];
  SPECIAL = []; SHELD = []; SHOLD = [];
  XM = null; GACK = false;
}

async function load(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { me = null; resetCaches(); return render(); }
  const [a, b, c, d] = await Promise.all([
    sb.from('profiles').select().eq('id', session.user.id).single(),
    sb.from('markets').select().order('created_at', {ascending:false}),
    sb.from('positions').select().eq('user_id', session.user.id),
    sb.rpc('my_cooldowns')
  ]);
  if (!a.data) { me = null; resetCaches(); return render(); }
  me = a.data;
  applyLook();
  markets = b.data || [];
  P = c.data || [];
  const t0 = Date.now();
  CD = (d.data || []).map(x => ({market_id: x.market_id, until: t0 + Math.round(+x.secs_left * 1000)}));
  MTok = {}; UPtok = {};
  render();
  ensureExtras();
}

const marketSig = ms => JSON.stringify(ms.map(m => [m.id, m.status, m.outcome, m.money_yes, m.money_no, m.promoted_at, m.boosted_at, m.closes_at, m.cooldown_seconds, m.is_motw]));
setInterval(async () => {
  if (!me || document.hidden) return;
  const el = document.activeElement;
  if (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
  const r = await sb.from('markets').select().order('created_at', {ascending:false});
  if (r.data && marketSig(r.data) !== marketSig(markets)) { markets = r.data; render(); }
  // owner: keep the Idea Box badge fresh
  if (me.role === 'owner') {
    const before = ideaNew();
    const q = await FETCH.ideas();
    if (!q.error) { LOADED.ideas = true; AT.ideas = Date.now(); if (ideaNew() !== before) render(); }
  }
  // keep the workshop meter fresh (it moves as everyone trades)
  if (Date.now() - (AT.xm || 0) > 25e3) { AT.xm = 0; ensureExtras(); }
  // keep earned banners/icons current (streak leaders change during the day)
  if (SPECIAL.length && Date.now() - (AT.special || 0) > 55e3) { AT.special = 0; AT.co = 0; ensureExtras(); }
}, 30000);

  featured: (a, b) => rank(a) - rank(b) || (rank(a) === 0 ? new Date(b.promoted_at) - new Date(a.promoted_at) : rank(a) === 1 ? ACT[b.id] - ACT[a.id] : rank(a) === 2 ? new Date(b.boosted_at) - new Date(a.boosted_at) : 0),
  newest: (a, b) => new Date(b.created_at) - new Date(a.created_at),
  oldest: (a, b) => new Date(a.created_at) - new Date(b.created_at),
  high: (a, b) => py(b) - py(a),
  low: (a, b) => py(a) - py(b),
  active: (a, b) => (ACT[b.id] || 0) - (ACT[a.id] || 0),
  closing: (a, b) => (a.closes_at ? new Date(a.closes_at) : Infinity) - (b.closes_at ? new Date(b.closes_at) : Infinity) || 0
};

const fnum = n => Math.round(+n || 0).toLocaleString();
const isXmasReward = x => /^(bn|ic)_xmas_/.test(x.id);
const isPresent = m => !!(XM && XM.active && XM.present_market_id === m.id && !m.is_motw);
const presentIcon = () => '';
const giftsUnseen = () => (XM && XM.santa) ? +XM.santa.unseen || 0 : 0;
const doorReady = () => !!(XM && XM.active && XM.advent && XM.advent.open_now && !XM.advent.today_opened);
const xmasPct = () => XM ? Math.max(0, Math.min(100, (+XM.total / +XM.goal) * 100)) : 0;
const meter = () => {
  const p = xmasPct(), fill = p > 0 ? Math.max(1, p) : 0;
  return `<div class="meter" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${fill}%"></i><span class="mk25"></span><span class="mk50"></span><span class="mk75"></span></div>`;
};
const xmasEnd = () => XM ? new Date(XM.ends_at).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '';
const giftBanner = () => {
  if (!XM || !XM.active || !giftsUnseen()) return '';
  const n = giftsUnseen(), sum = ((XM.santa || {}).in || []).filter(g => g.unseen).reduce((a, g) => a + (+g.amount || 0), 0);
  return `<div class="card gift-in"><span class="pct-pill">🎁</span> <b>A Secret Santa left you ${n > 1 ? n + ' gifts' : 'a gift'}${sum ? ` worth ${fnum(sum)} tokens` : ''}!</b> <span class="mut">${n > 1 ? 'They are' : 'It is'} already in your balance.</span> <a href="#/santa">See ${n > 1 ? 'your gifts' : 'your gift'} →</a></div>`;
};
function xmasBanner(){
  if (!XM) return '';
  const endMs = new Date(XM.ends_at).getTime();
  if (Date.now() > endMs + 3 * 864e5) return '';
  const over = Date.now() >= endMs, p = xmasPct();
  const msg = over
    ? (XM.rolled ? (XM.goal_met ? 'The elves filled the meter. Prizes were paid!' : 'The meter fell short, so everyone with enough points got a small consolation gift instead.') : 'The sleigh is taking off! Counting the results...')
    : (p >= 100 ? 'The meter is FULL! Keep going, prizes are paid when the sleigh leaves.' : 'Fill the meter together to unlock the big prizes. Nobody loses anything if we miss, but the North Pole keeps the loot!');

}
function eventBanner(){

const ptMonth = () => +new Intl.DateTimeFormat('en-US', {timeZone:'America/Los_Angeles', month:'numeric'}).format(new Date());
function xmasBurst(){
  const E = ['🎁', '⭐', '🎄', '❄️', '🍬', '🔔'], box = $('#rf');
  if (!box) return;
  box.innerHTML = '<div class="burst">' + Array.from({length:36}, (_, i) => `<span style="left:${Math.round(rnd(0, 100))}%;animation-delay:${rnd(0, 1.2).toFixed(2)}s">${E[i % E.length]}</span>`).join('') + '</div>';

  <h2>Santa's Workshop</h2><p>From now until the end of <b>December 17</b> (Pacific), everybody fills one big community meter together on the <a href="#/xmas">Santa's Workshop</a> page. Your <b>very first trade ever</b> adds 25 points, and your first trade of any other day adds 5. Opening an <b>Advent door</b> adds 2, every <b>Secret Santa</b> gift you send adds 3, every <b>approved market suggestion</b> adds 15, and every friend who joins with your link adds 20. <b>If the meter is full when the sleigh leaves</b> (midnight going into December 18), every player with 25 or more points gets tokens by rank: <b>400</b> for the top 10, <b>250</b> for the next 20, and <b>125</b> for everybody below that. The top elf also wins <b>750 bonus tokens</b>, and the top 5 win Christmas banners and icons. If the meter is not full, nobody loses anything, and everyone with 25 or more points gets a 50-token consolation gift.</p>

const loadImg = url => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
const toBlob = (c, t, q) => new Promise(r => c.toBlob(r, t, q));
// shrink / convert a chosen image (used by shop uploads and special-item uploads)
async function prepImage(file, fileUrl, kind){
  if (file.type === 'image/gif' && file.size <= 1048576) return {blob: file, ext: 'gif'}; // keeps animation
  const img = await loadImg(fileUrl);
  const max = kind === 'banner' ? 1000 : 128, k = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const b = kind === 'icon' ? await toBlob(c, 'image/png') : await toBlob(c, 'image/webp', .88);
  const ext = b && {'image/png':'png', 'image/webp':'webp', 'image/jpeg':'jpg'}[b.type];
  if (!ext) throw new Error('encode');
  return {blob: b, ext};
}

  <div class="stats">${stat('Tokens', (+me.balance).toFixed(1))}${stat('Net worth', (+s.net_worth || 0).toFixed(1))}${stat('Net profit', (p >= 0 ? '+' : '') + p.toFixed(1))}${stat('Trades', s.trades || 0)}</div>
  <div class="mut" style="margin:-4px 0 14px">Net profit counts trading gains only: it excludes referral bonuses and adds back what you spent in the Shop (${(+s.shop_spent || 0).toFixed(0)} so far).</div>
  <div class="two"><div><div class="card"><b>Trade history</b> <span class="mut">(last 100)</span>${hist}</div></div>
  <div>
    <div class="card"><b>Profile picture</b><div class="row">${avatar(me.username, 56)}<label class="up"><input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadAvatar(this)" hidden><span class="btn">Upload image</span></label>${me.avatar_path ? '<button class="g" onclick="rmAvatar()">Remove</button>' : ''}</div>
      <p class="mut">Or pick an emoji:</p><div class="avs">${AV.map((e, i) => `<button class="g${me.avatar === 'a' + i && !me.avatar_path ? ' sel' : ''}" onclick="look({avatar:'a${i}'})">${e}</button>`).join('')}</div></div>
    <div class="card"><b>Username</b><input id="nu" value="${esc(me.username)}" maxlength="20"><div class="row"><button onclick="rpc('change_username',{p_name:$('#nu').value},'Username updated')">Save username</button></div><p class="mut" style="margin-bottom:0">3-20 letters, numbers, . _ - · once every 24 hours.</p></div>
    <div class="card"><b>Privacy</b><p class="mut">Other players can open your profile from the leaderboards. Choose whether they can see your portfolio and trade history.</p>
      <div class="row"><button class="g${me.show_activity !== false ? ' sel' : ''}" onclick="setVisible(true)">Visible</button><button class="g${me.show_activity === false ? ' sel' : ''}" onclick="setVisible(false)">Hidden</button></div></div>
    <div class="card"><b>Background pattern</b><p class="mut">The Christmas theme is the same for everyone. Wrapping paper is the default. Pick the pattern behind the page.</p>${pick(PATS, 'pattern')}</div>
    <div class="card"><b>Banner and icon</b><p class="mut">Buy them in the <a href="#/shop">Shop</a>, then equip them from your <a href="#/inventory">Inventory</a>.</p></div>
    <div class="card"><b>Your referral link</b><p class="mut">Earn ${REFERRER_BONUS} tokens for every friend who signs up and confirms their email. They get ${FRIEND_BONUS} too (and you add 20 points to Santa's Workshop!).</p><input readonly value="${esc(refLink())}" onclick="this.select()"><div class="row"><button onclick="navigator.clipboard.writeText(refLink());toast('Link copied!')">Copy link</button></div></div>
    ${me.role === 'user' ? `<div class="card"><b>Have an admin invite code?</b><input id="ic" placeholder="Code"><div class="row"><button onclick="redeem()">Redeem</button></div></div>` : ''}
  </div></div>`;
}

// ---------- Inventory ----------
// everything you own: bought shop items + earned items you hold right now
function pgInventory(){
  const xmasLocked = SHOP.filter(x => isXmasReward(x) && !OWN.includes(x.id));
  const mine = SHOP.filter(x => OWN.includes(x.id)).concat(SPECIAL.filter(x => SHELD.includes(x.id)));
  const locked = SPECIAL.filter(x => !SHELD.includes(x.id));
  const card = x => {
    const on = me.icon === x.id || me.banner === x.id;
    return `<div class="card split"><div>${itemPrev(x)}<div class="mut" style="margin-top:4px">${esc(x.name)}${(x.special || isXmasReward(x)) ? ' <span class="chip">EARNED</span>' : ''}${on ? ' <span class="chip">EQUIPPED</span>' : ''}${x.special ? `<br>${CRIT[x.criteria] || ''}` : ''}</div></div>
      <button class="g" onclick="equip('${x.kind}','${on ? '' : x.id}')">${on ? 'Unequip' : 'Equip'}</button></div>`;
  };
  const section = (title, kind) => {
    const items = mine.filter(x => x.kind === kind);
    return `<h2>${title}</h2>` + (items.length ? `<div class="grid">${items.map(card).join('')}</div>` : `<p class="mut">No ${title.toLowerCase()} yet. <a href="#/shop">Visit the Shop</a>.</p>`);
  };
  const lockedCard = x => {
    const h = holdersOf(x);
    return `<div class="card"><div class="dim">${itemPrev(x)}</div><div class="mut" style="margin-top:6px">${esc(x.name)} <span class="chip">LOCKED</span><br>Earned by having the ${esc(CRIT[x.criteria] || '').replace(/^./, c => c.toLowerCase())}<br>Held by: ${h.length ? h.map(u => nm(u)).join(' ') : 'nobody yet'}</div></div>`;
  };
  const xmasCard = x => `<div class="card"><div class="dim">${itemPrev(x)}</div><div class="mut" style="margin-top:6px">${esc(x.name)} <span class="chip">LOCKED</span><br>Earned by finishing ${x.id.includes('_head') || x.id.includes('_golden') ? '#1' : 'in the top 5'} in the Santa\'s Workshop Nice List</div></div>`;
  const earn = locked.map(lockedCard).join('') + xmasLocked.map(xmasCard).join('');
  return `<h1>Account</h1>${acctTabs('inventory')}
  <p class="mut">Everything you own. Equipped items show next to your name everywhere. Buy more in the <a href="#/shop">Shop</a>.</p>
  ${section('Banners', 'banner')}${section('Icons', 'icon')}
  ${earn ? `<h2>Earnable</h2><p class="mut">Special items you can win. Hold the lead and it is equipped for you automatically.</p><div class="grid">${earn}</div>` : ''}`;
}
const look = o => rpc('set_look', {p_avatar:o.avatar || null, p_theme:o.theme || null, p_pattern:o.pattern || null}, 'Saved');
const rmAvatar = async () => { const old = me.avatar_path; await rpc('set_avatar_path', {p_path:null}, 'Picture removed'); if (old) sb.storage.from('avatars').remove([old]); };
function uploadAvatar(inp){
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size > 8e6) return toast('Choose a JPG, PNG or WebP under 8 MB.');
  const url = URL.createObjectURL(f), img = new Image();
  img.onerror = () => toast('Could not read that image.');
  img.onload = () => {
    const s = Math.min(img.width, img.height), c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = c.height = 192;
    x.fillStyle = '#fff'; x.fillRect(0, 0, 192, 192);
    x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 192, 192);
    URL.revokeObjectURL(url);
    c.toBlob(async b => {
      const path = me.id + '/' + Date.now() + '.jpg', old = me.avatar_path;
      const up = await sb.storage.from('avatars').upload(path, b, {contentType:'image/jpeg'});
      if (up.error) return toast(/bucket not found/i.test(up.error.message) ? 'The latest SQL update has not been applied to this Supabase project yet. Run update.sql in the SQL Editor of the project your site uses.' : up.error.message);
      await rpc('set_avatar_path', {p_path:path}, 'Picture updated');
      if (old) sb.storage.from('avatars').remove([old]);
    }, 'image/jpeg', .86);
  };
  img.src = url;
}

// ---------- Idea Box ----------
function pgIdeas(){
  const own = me.role === 'owner';
  const rows = IDEAS.map(x => `<tr><td>${esc(x.body)}</td>${own ? `<td>${x.profiles ? nm(x.profiles.username) : '?'}</td>` : ''}<td>${new Date(x.created_at).toLocaleDateString()}</td><td><span class="chip">${x.status}</span>${own ? `<div class="row">${['planned', 'done', 'declined'].map(s => `<button class="g" onclick="setIdea(${x.id},'${s}')">${s}</button>`).join('')}</div>` : ''}</td></tr>`).join('');
  return `<h1>Idea Box</h1><p class="mut">Got an idea for the website? New features, fixes, shop items, anything. It goes straight to the owner.</p>
  <div class="card narrow"><textarea id="ib" rows="4" maxlength="500" placeholder="I think the site should..."></textarea><div class="row"><button class="tk" onclick="sendIdea()">❄️ Send idea</button><span class="mut">Up to 5 per day</span></div></div>
  <h2>${own ? 'All ideas' : 'Your ideas'}</h2>${IDEAS.length ? `<div class="card"><table><tr><th>Idea</th>${own ? '<th>From</th>' : ''}<th>Sent</th><th>Status</th></tr>${rows}</table></div>` : '<p class="mut">None yet.</p>'}`;
}
async function sendIdea(){
  const {error} = await sb.rpc('submit_idea', {p_body:$('#ib').value});
  if (error) return toast(error.message);
  toast('Sent to the owner. Thanks!');
  $('#ib').value = ''; AT.ideas = 0; ensureExtras();
}
const setIdea = (id, s) => rpc('set_idea_status', {p_id:id, p_status:s});

// ---------- Streak badge ----------
const toggleStk = () => { STK_OPEN = !STK_OPEN; render(); };
const xmasFab = () => XM ? `<a class="xmas-fab" href="#/xmas" title="Santa's Workshop: ${Math.floor(xmasPct())}% full"><span class="tk">🎅</span><span>${Math.floor(xmasPct())}%</span></a>` : '';
function streakBadge(){
  if (!STK) return XM ? `<div id="stk">${xmasFab()}</div>` : '';
  const n = +STK.streak, t = +STK.today_trades, g = +STK.goal, pct = +STK.bonus_pct;
  const need = Math.max(0, g - t);
  const status = need === 0 ? 'Today\'s goal is done. Your streak is safe.'
    : (n > 0 ? `Make ${need} more trade${need === 1 ? '' : 's'} today to keep your streak.` : `Make ${need} more trade${need === 1 ? '' : 's'} today to start a streak.`);
  const panel = STK_OPEN ? `<div class="stk-panel"><b>Daily streak</b>
    <p>Streak: <b>${n}</b> day${n === 1 ? '' : 's'}</p><p>Trades today: <b>${t} / ${g}</b></p><p>Cash-out bonus: <b>${pct.toFixed(1)}%</b> of profit</p>
    <p class="mut">${status}</p><p class="mut">+0.1% per streak day, max 10%. Missing a day resets it. Days run midnight to midnight Pacific.</p></div>` : '';
  return `<div id="stk">${panel}${xmasFab()}<button class="stk-btn${n ? '' : ' off'}" onclick="toggleStk()" aria-label="Streak details" title="Daily trading streak">🔥 <b>${n}</b></button></div>`;
}

// ---------- shell + router ----------
function render(){
  lastRender = Date.now();
  if (!me) return authView();
  const keep = {};
  document.querySelectorAll('input[id],textarea[id],select[id]').forEach(i => keep[i.id] = i.value);
  const [pg, arg] = (location.hash.slice(2) || 'markets').split('/');
  const staff = me.role !== 'user', owner = me.role === 'owner';
  const pend = PR.filter(p => p.status === 'pending').length;
  const meBn = itemById(me.banner);
  const link = (id, label, badge) => `<a href="#/${id}" class="${id === pg || (id === 'markets' && pg === 'market') || (id === 'leaderboard' && pg === 'user') ? 'on' : ''}">${ico(IC[id])}${label}${badge ? `<span class="chip">${badge}</span>` : ''}</a>`;
  const pages = {markets: pgMarkets, market: () => pgMarket(+arg), portfolio: pgPortfolio, leaderboard: pgBoard, xmas: pgXmas, advent: pgAdvent, santa: pgSanta, user: () => pgUser(decodeURIComponent(arg || '')), shop: pgShop, ideas: pgIdeas, rules: pgRules, suggest: pgSuggest, create: pgCreate, review: pgReview, admin: pgAdmin, account: pgAccount, inventory: pgInventory};
  const ok = {create: staff, review: staff, admin: owner, suggest: !staff};
  const waiting = BLOCKING[pg] && (EXTRAS[pg] || []).some(k => !LOADED[k]);
  const body = !pages[pg] ? '<p>Page not found.</p>' : (pg in ok && !ok[pg]) ? '<p class="mut">You do not have access to this page.</p>' : waiting ? '<p class="mut">Loading...</p>' : pages[pg]();

  $('#app').innerHTML = `<div id="shell"><nav><h2>EagleEye Market</h2>
    ${link('xmas', "Santa's Workshop")}${link('advent', 'Advent Calendar', doorReady() ? '1' : '')}${link('santa', 'Secret Santa', giftsUnseen() || '')}${link('markets', 'Markets')}${link('portfolio', 'Portfolio')}${link('leaderboard', 'Leaderboard')}${link('shop', 'Shop')}${link('ideas', 'Idea Box', ideaNew() || '')}${link('rules', 'Rules')}
    ${staff ? link('create', 'Create market') + link('review', 'Review', pend || '') : link('suggest', 'Suggest a market')}
    ${owner ? link('admin', 'Admin tools') : ''}
    <div class="navref"><span class="mut">Your referral link</span><input readonly value="${esc(refLink())}" onclick="this.select()" aria-label="Your referral link"><button onclick="navigator.clipboard.writeText(refLink());toast('Link copied!')">Copy link</button></div>
    <a href="#/account" class="me${pg === 'account' || pg === 'inventory' ? ' on' : ''}${meBn ? ' bn' : ''}"${meBn ? ` style="${esc(bannerStyle(meBn))}"` : ''}>${avatar(me.username, 30)}<span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis">${esc(me.username)}</b><span class="mut">${(+me.balance).toFixed(0)} tokens</span></span></a>
    </nav><main>${PAGE_STICKERS}<div id="rb">${giftBanner()}${eventBanner()}${pg === 'xmas' ? '' : xmasBanner()}</div>${body}</main></div><div id="stkw">${streakBadge()}</div>`;

  for (const k in keep) { const el = document.getElementById(k); if (el) el.value = keep[k]; }
  if (pg === 'admin') { showShopPreview(); showSpecialPreview(); }
  if (pg === 'market' && staff && !MTok[+arg]) fetchTrades(+arg);
  if (pg === 'user' && arg && !UPtok[decodeURIComponent(arg)]) fetchUser(decodeURIComponent(arg));
  // opening the Secret Santa page marks your gifts as seen, so the banner goes away on the next refresh
  if (pg === 'santa' && giftsUnseen() > 0 && !GACK) { GACK = true; sb.rpc('xmas_ack_gifts').then(() => { GACK = false; AT.xm = 0; setTimeout(() => ensureExtras(), 8000); }); }
}

addEventListener('hashchange', () => { UPtok = {}; render(); scrollTo(0, 0); ensureExtras(); });

const tradesCard = id => {
  if (me.role === 'user') return '';
  const rows = MT[id];
  const body = !rows ? '<p class="mut">Loading...</p>' : !rows.length ? '<p class="mut">No trades yet.</p>' :
    `<table><tr><th>Time</th><th>User</th><th>Action</th><th>Tokens</th><th>YES price after</th></tr>${rows.map(r =>
      `<tr><td>${new Date(r.ts).toLocaleString()}</td><td>${r.username ? nm(r.username) : 'deleted user'}</td><td>${r.kind === 'buy' ? 'Bought' : 'Cashed out'} ${r.side.toUpperCase()}</td><td>${(+r.tokens).toFixed(1)}</td><td>${(+r.price_yes * 100).toFixed(0)}%</td></tr>`).join('')}</table>`;
  return `<div class="card" style="margin-top:18px"><b>All trades on this market</b> <span class="mut">(admins only)</span>${body}</div>`;
};

const toLocalInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

const adminBox = m => me.role === 'user' ? '' : `<div class="card"><b>Admin controls</b>
  ${m.status === 'open' ? `<div class="row"><button class="g" onclick="promote(${m.id},${!m.promoted_at})">${m.promoted_at ? 'Remove promotion' : 'Promote to top of Markets page'}</button>
  <button class="g" onclick="boost(${m.id},${!m.boosted_at})">${m.boosted_at ? 'Remove untagged promotion' : 'Promote without a tag'}</button>
  <button class="g" onclick="setMotw(${m.id},${!m.is_motw})">${m.is_motw ? 'Remove Market of the Week' : 'Make Market of the Week'}</button></div>
  <label class="mut" style="margin-top:12px">Close time<input id="cl${m.id}" type="datetime-local" value="${m.closes_at ? toLocalInput(m.closes_at) : ''}"></label>
  <div class="row"><button class="g" onclick="setClose(${m.id})">Save close time</button><button class="g" onclick="clearClose(${m.id})">No close time</button></div>
  <label class="mut" style="margin-top:12px">Cooldown (hours)<input id="ck${m.id}" type="number" min="0" step="0.5" value="${+(m.cooldown_seconds / 3600).toFixed(2)}"></label>
  <div class="row"><button class="g" onclick="setCooldown(${m.id})">Save cooldown</button></div>` : '<p class="mut">Controls are available while a market is open.</p>'}</div>`;

const promote = (id, on) => rpc('promote_market', {p_market:id, p_on:on});
const setMotw = (id, on) => rpc('set_motw', {p_market:id, p_on:on});
const setCooldown = id => {
  const h = parseFloat($('#ck'+id).value);
  if (!(h >= 0)) return toast('Enter the cooldown in hours.');
  rpc('set_cooldown', {p_market:id, p_seconds:Math.round(h * 3600)});
};
const boost = (id, on) => rpc('boost_market', {p_market:id, p_on:on});
const setClose = id => {
  const v = $('#cl'+id).value;
  if (!v) return toast('Pick a date and time, or use "No close time".');
  rpc('set_close_date', {p_market:id, p_closes:new Date(v).toISOString()});
};
const clearClose = id => { $('#cl'+id).value = ''; rpc('set_close_date', {p_market:id, p_closes:null}); };

async function fetchTrades(id){
  MTok[id] = true;
  const {data, error} = await sb.rpc('market_trades', {p_market:id});
  if (error) toast(error.message);
  MT[id] = data || [];
  render();
}

// ---------- actions ----------
const buy = (id, side) => +$('#a'+id).value >= 10 ? rpc('trade', {p_market:id, p_side:side, p_tokens:+$('#a'+id).value, p_action:'buy'}) : toast('Minimum bet is 10 tokens.');
const sell = (id, side) => rpc('trade', {p_market:id, p_side:side, p_tokens:0, p_action:'sell'});

// ---------- Quick bet pop-up (Market of the Week card) ----------
let qbKey = null;
function closeQuickBet(){
  const d = $('#qb'); if (d) d.remove();
  if (qbKey) { document.removeEventListener('keydown', qbKey); qbKey = null; }
}
function quickBet(ev, id, side){
  ev.stopPropagation(); ev.preventDefault();
  const m = markets.find(x => x.id === id); if (!m) return;
  const i = info(m);
  if (!i.open || i.closed) return toast('Trading is closed on this market.');
  if (i.locked) return toast('Locked until ' + new Date(i.until).toLocaleString());
  if (P.some(p => p.market_id === id && +p.shares > 0)) return toast('You already have a position here. Cash out first to trade again.');
  closeQuickBet();
  const S = side.toUpperCase(), d = document.createElement('div');
  d.id = 'qb'; d.className = 'qb-back';
  d.innerHTML = `<div class="qb" role="dialog" aria-modal="true" aria-labelledby="qbt">
    <b id="qbt">How much would you like to bet?</b>
    <div class="mut" style="margin-top:4px"><b style="color:var(--${side})">${S}</b> · ${esc(m.question)}</div>
    <input id="qba" type="number" min="10" step="1" inputmode="numeric" placeholder="Tokens (minimum 10)" autocomplete="off">
    <div class="row">${[10, 50, 100].map(n => `<button class="g" data-n="${n}">${n}</button>`).join('')}</div>
    <p class="mut">You have ${(+me.balance).toFixed(1)} tokens.</p>
    <div class="row"><button class="${side === 'yes' ? 'y' : 'n'}" id="qbok">Bet ${S}</button><button class="g" id="qbx">Cancel</button></div></div>`;
  document.body.appendChild(d);
  const inp = $('#qba');
  d.addEventListener('click', e => { if (e.target === d) closeQuickBet(); });
  d.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => { inp.value = b.dataset.n; inp.focus(); }));
  $('#qbx').addEventListener('click', closeQuickBet);
  const submit = async () => {
    const n = +inp.value;
    if (!(n >= 10)) return toast('Minimum bet is 10 tokens.');
    closeQuickBet();
    await rpc('trade', {p_market:id, p_side:side, p_tokens:n, p_action:'buy'}, 'Bet placed: ' + n + ' tokens on ' + S);
  };
  $('#qbok').addEventListener('click', submit);
  qbKey = e => { if (e.key === 'Escape') closeQuickBet(); else if (e.key === 'Enter' && document.activeElement === inp) submit(); };
  document.addEventListener('keydown', qbKey);
  inp.focus();
}

async function mk(){
  const id = await rpc('create_market', {p_question:$('#q').value, p_yes:$('#o').value/100, p_cooldown:Math.round($('#c').value*3600), p_closes:$('#d').value ? new Date($('#d').value).toISOString() : null});
  if (id) { toast('Market created'); go('market/' + id); }
}

async function propose(){
  const h = parseFloat($('#sc').value);
  const {error} = await sb.rpc('submit_proposal', {p_question:$('#sq').value, p_closes:$('#sd').value ? new Date($('#sd').value).toISOString() : null, p_cooldown:h >= 0 ? Math.round(h * 3600) : null});
  if (error) return toast(error.message);
  toast('Submitted for review');
  $('#sq').value = ''; $('#sd').value = ''; $('#sc').value = '';
  AT.pr = 0;
  load();
}

const approve = id => rpc('approve_proposal', {p_id:id, p_question:$('#pq'+id).value, p_yes:$('#po'+id).value/100, p_cooldown:Math.round($('#pc'+id).value*3600), p_note:$('#pn'+id).value});
const reject = id => rpc('reject_proposal', {p_id:id, p_note:$('#pn'+id).value});
const res = (id, o) => confirm(o === 'void' ? 'Cancel this market and refund everyone\'s stakes? This cannot be undone.' : 'Resolve as ' + o.toUpperCase() + '? This pays out winners and cannot be undone.') && rpc('resolve_market', {p_market:id, p_outcome:o});
const inv = () => rpc('make_invite').then(c => c && prompt('Share this one-time code:', c));
const setRole = (u, r) => rpc('set_role', {p_username:u, p_role:r});
const recordFinal = () => confirm('Record the final standings now? This can only be done once.') && rpc('record_final_standings');
const redeem = () => rpc('redeem_invite', {p_code:$('#ic').value});

async function checkReferralAlerts(){
  if (!me) return;
  const {data} = await sb.rpc('claim_referral_alerts');
  if (data && data.length) {
    toast('New referral! ' + data.map(x => x.username).join(', ') + ' joined with your link! Bonus added!');
    AT.ev = 0;
    load();
  }
}
setInterval(() => { if (!document.hidden) checkReferralAlerts(); }, 30000);

load().then(checkReferralAlerts);
</script>
